name: ProtoForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests (no Ollama)
        run: |
          .venv/bin/python -q -m pytest tests -q
          .venv/bin/python -m pyflakes $(git ls-files '*.py')

  bench-smoke:
    name: 3-Case Template Benchmark Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run 3-case template benchmark (no Ollama)
        run: |
          .venv/bin/python -m bench.run \
            --configs template \
            --samples 1 \
            --case-limit 3 \
            --out-dir /tmp/bench_ci \
            --quiet

      - name: Verify all 3 pass
        run: |
          .venv/bin/python -c "import json; summary = json.load(open('/tmp/bench_ci/summary.json')); assert summary['configs']['template']['pass_at_1'] == 3, summary; print('CI smoke test: 3/3 template cases passed')"